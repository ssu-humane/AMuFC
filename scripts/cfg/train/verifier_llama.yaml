prompt: "Given a claim, your task is to determine the correct verdict based on the provided [evidence]. Provide a short justification for your answer, then choose one of the following verdicts: 'Supported', 'Refuted', or 'NEI' (Not Enough Information)."

model_id: "meta-llama/Llama-3.2-11B-Vision-Instruct"
save_path: checkpoints/verifier_llama32v

verifier: true
analyzer: false
selector: false

peft_config:
  lora_alpha: 256
  lora_dropout: 0.05
  r: 128
  bias: "none"
  target_modules: ["q_proj", "v_proj"]
  task_type: "CAUSAL_LM"

bnb_config:
  load_in_4bit: true
  bnb_4bit_use_double_quant: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"

deepspeed_conf: null
epochs: 2
batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 2e-5
warmup_ratio: 0.03
max_seq_length: 6144
dataset_text_field: ""
dataset_kwargs:
  skip_prepare_dataset: true
dataloader_num_workers: 4
seed: 42